# Install as /etc/nginx/sites-available/tempo-clubrecords.
# Replace records.example.com, enable the site, then use Certbot to add HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name clubrecords.tempo.jield.dev;

    # Allow a 10 MiB file plus multipart form overhead.
    client_max_body_size 11m;

    # Proxy the entire site: Fastify serves dist/ and handles API/SPA routes.
    # Never expose the application directory or SQLite files as an Nginx root.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # /api/events uses SSE, including a heartbeat every 25 seconds.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
    }
}
